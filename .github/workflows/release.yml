name: Release

"on":
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate exact tag and version identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9.][0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)"
          SPEC_DEFAULT_VERSION="$(sed -n -E 's/.*upstream_version[[:space:]]+([0-9.]+).*/\1/p; s/.*upstream_version:([0-9.]+).*/\1/p' packaging/rpm/ro-control.spec | head -n1)"

          [[ "${TAG}" == "v${VERSION}" ]]
          [[ "${VERSION}" == "${PROJECT_VERSION}" ]]
          [[ "${VERSION}" == "${SPEC_DEFAULT_VERSION}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" == "${GITHUB_SHA}" ]]

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  rpm:
    name: Build Fedora 44 RPM (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: fedora:44

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install packaging dependencies
        run: |
          dnf install -y \
            git \
            rpm-build \
            cmake \
            extra-cmake-modules \
            gcc-c++ \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qttools-devel \
            qt6-qtwayland-devel \
            kf6-qqc2-desktop-style \
            polkit-devel \
            desktop-file-utils \
            appstream

      - name: Build exact Fedora 44 RPM set
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RPM_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          TOPDIR="${HOME}/rpmbuild"
          mkdir -p "${TOPDIR}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} release-rpms

          STAGE_DIR="$(mktemp -d)"
          ARCHIVE_ROOT="ro-control-${VERSION}"
          mkdir -p "${STAGE_DIR}/${ARCHIVE_ROOT}"
          git archive "${GITHUB_SHA}" | tar -x -C "${STAGE_DIR}/${ARCHIVE_ROOT}"
          tar -C "${STAGE_DIR}" -czf "${TOPDIR}/SOURCES/${ARCHIVE_ROOT}.tar.gz" "${ARCHIVE_ROOT}"
          rm -rf "${STAGE_DIR}"

          cp packaging/rpm/ro-control.spec "${TOPDIR}/SPECS/ro-control.spec"
          # Ro-Repo V2 requires the real RPM Release field to carry the Fedora 44 dist tag.
          sed -i -E 's/^Release:[[:space:]]+1$/Release:        1%{?dist}/' "${TOPDIR}/SPECS/ro-control.spec"
          grep -Eq '^Release:[[:space:]]+1%\{\?dist\}$' "${TOPDIR}/SPECS/ro-control.spec"

          rpmbuild -ba "${TOPDIR}/SPECS/ro-control.spec" \
            --define "_topdir ${TOPDIR}" \
            --define "upstream_version ${VERSION}" \
            --define "dist .fc44"

          BINARY_RPM="$(find "${TOPDIR}/RPMS" -type f -name "ro-control-*.${RPM_ARCH}.rpm" -print -quit)"
          test -n "${BINARY_RPM}"
          [[ "$(rpm -qp --qf '%{NAME}' "${BINARY_RPM}")" == "ro-control" ]]
          [[ "$(rpm -qp --qf '%{VERSION}' "${BINARY_RPM}")" == "${VERSION}" ]]
          [[ "$(rpm -qp --qf '%{RELEASE}' "${BINARY_RPM}")" == *.fc44 ]]
          [[ "$(rpm -qp --qf '%{ARCH}' "${BINARY_RPM}")" == "${RPM_ARCH}" ]]
          cp "${BINARY_RPM}" release-rpms/

          if [[ "${RPM_ARCH}" == "x86_64" ]]; then
            SOURCE_RPM="$(find "${TOPDIR}/SRPMS" -type f -name 'ro-control-*.src.rpm' -print -quit)"
            test -n "${SOURCE_RPM}"
            [[ "$(rpm -qp --qf '%{RELEASE}' "${SOURCE_RPM}")" == *.fc44 ]]
            cp "${SOURCE_RPM}" release-rpms/
          fi

      - name: Install and smoke-test binary RPM
        env:
          RPM_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          RPM_FILE="$(find release-rpms -maxdepth 1 -type f -name "*.${RPM_ARCH}.rpm" -print -quit)"
          test -n "${RPM_FILE}"
          dnf install -y --nogpgcheck "${RPM_FILE}"
          rpm -q ro-control
          command -v ro-control
          ldd -r /usr/bin/ro-control
          ro-control --help >/dev/null

      - name: Upload exact RPM build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-control-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: release-rpms/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish attested Ro-Repo V2 release
    needs: [metadata, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download exact RPM set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ro-control-*-${{ needs.metadata.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Install release metadata tools
        run: sudo apt-get update && sudo apt-get install -y rpm jq

      - name: Verify release bundle before publication
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find release-assets -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          if [[ "${#RPMS[@]}" -ne 3 ]]; then
            printf 'Expected exactly 3 RPMs, found: %s\n' "${RPMS[*]}" >&2
            exit 1
          fi

          ARCHES="$(for rpm in "${RPMS[@]}"; do rpm -qp --qf '%|SOURCEPACKAGE?{src}:%{ARCH}|\n' "release-assets/${rpm}"; done | sort | paste -sd, -)"
          [[ "${ARCHES}" == "aarch64,src,x86_64" ]]

          for rpm in "${RPMS[@]}"; do
            [[ "$(rpm -qp --qf '%{NAME}' "release-assets/${rpm}")" == "ro-control" ]]
            [[ "$(rpm -qp --qf '%{VERSION}' "release-assets/${rpm}")" == "${{ needs.metadata.outputs.version }}" ]]
            [[ "$(rpm -qp --qf '%{RELEASE}' "release-assets/${rpm}")" == *.fc44 ]]
          done

          SOURCE_RPM="$(printf '%s\n' "${RPMS[@]}" | grep '\.src\.rpm$')"
          for rpm in "${RPMS[@]}"; do
            [[ "${rpm}" == *.src.rpm ]] && continue
            [[ "$(rpm -qp --qf '%{SOURCERPM}' "release-assets/${rpm}")" == "${SOURCE_RPM}" ]]
          done

      - name: Create clean draft GitHub Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [[ -n "${EXISTING}" ]]; then
            EXISTING_ID="$(jq -r '.id' <<<"${EXISTING}")"
            if [[ "$(jq -r '.draft' <<<"${EXISTING}")" == "true" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
            else
              echo "Published release ${TAG} already exists; tag/release reuse is forbidden." >&2
              exit 1
            fi
          fi

          RELEASE_JSON="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${TAG}" \
            -F draft=true \
            -F generate_release_notes=true)"
          RELEASE_ID="$(jq -r '.id' <<<"${RELEASE_JSON}")"
          test -n "${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Generate strict SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find . -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          [[ "${#RPMS[@]}" -eq 3 ]]
          sha256sum "${RPMS[@]}" > SHA256SUMS
          [[ "$(wc -l < SHA256SUMS)" -eq 3 ]]

      - name: Generate component artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/scripts/build-ro-repo-manifest.py \
            --artifacts-dir release-assets \
            --output release-assets/component-artifact-manifest-v1.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --release-id "${{ steps.draft.outputs.release_id }}" \
            --workflow-run "${GITHUB_RUN_ID}"

      - name: Attest RPMs, checksum file and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/SHA256SUMS
            release-assets/component-artifact-manifest-v1.json

      - name: Upload immutable release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/*.rpm \
            release-assets/SHA256SUMS \
            release-assets/component-artifact-manifest-v1.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false >/dev/null
